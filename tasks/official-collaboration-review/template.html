<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory26 · 官网协作复审</title>
<style>
:root{font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2328;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}header{background:#25292e;color:white;padding:18px 28px;display:flex;align-items:center;gap:22px}header strong{font-size:18px}header small{color:#b6c1ce}button,input,select{font:inherit;border:1px solid #d0d7de;border-radius:6px;padding:6px 10px;background:white;color:#1f2328}button{cursor:pointer}button:hover{background:#eef2f6}header button.active{background:#dbeafe}main{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1600px;margin:auto}aside{padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #d0d7de}.filters{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}#search{width:100%}.row{display:block;text-decoration:none;color:inherit;border:1px solid transparent;border-radius:6px;padding:10px;margin:4px 0;background:white}.row:hover,.row.selected{border-color:#0969da;background:#ddf4ff}.row strong{display:block}.muted{color:#656d76;font-size:12px}.badge{display:inline-block;background:#8250df;color:white;border-radius:20px;padding:2px 10px;font-size:12px}.OPEN{background:#1a7f37}.CLOSED{background:#8250df}.MERGED{background:#8250df}.content{padding:24px 36px;min-width:0}.content h1{font-size:27px;line-height:1.35;margin:0 0 12px}.card{border:1px solid #d0d7de;border-radius:7px;background:white;margin:16px 0;overflow:hidden}.card-head{padding:10px 16px;background:#f6f8fa;border-bottom:1px solid #d0d7de;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.body{padding:18px;overflow-wrap:anywhere}.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}.body pre{background:#f6f8fa;padding:14px;overflow:auto}.body code{font-size:12px;background:#eff1f3;border-radius:3px}.body table{border-collapse:collapse;display:block;overflow:auto}.body th,.body td{border:1px solid #d0d7de;padding:6px 12px}.body img{max-width:100%}.body h1{font-size:23px}.body h2{font-size:20px}.body h3{font-size:17px}a{color:#0969da}details{padding:8px 12px;background:#f6f8fa;border-top:1px solid #d0d7de}summary{cursor:pointer}.reply{margin-left:30px;border-left:3px solid #d0d7de}.notice{background:#fff8c5;border:1px solid #eac54f;padding:12px;border-radius:6px;margin:16px 0}.relations{display:flex;gap:8px;flex-wrap:wrap}.activity{padding:10px 16px;border-bottom:1px solid #eaeef2}.flash{outline:3px solid #bf8700}.empty{padding:30px;color:#656d76}.tag{background:#ddf4ff;border-radius:4px;padding:1px 6px}.meta{display:flex;gap:12px;flex-wrap:wrap}.toolbar{display:flex;gap:8px;margin:20px 0}.toolbar button.active{color:#0969da;border-color:#0969da}@media(max-width:800px){main{display:block}aside{height:auto;position:relative;max-height:40vh}.content{padding:20px}}
</style>
<header><strong>◉ Factory26 / 协作复审</strong><button data-task="github">GitHub</button><button data-task="sheet">Sheet</button><small>官网保存快照 · 只读 · 所有时间 UTC</small></header>
<main><aside><input id="search" placeholder="搜索标题、描述、评论、成员"><div class="filters"><select id="kind"><option value="">Issue + PR</option value="issue">Issues</option><option value="pr">Pull requests</option></select><select id="state"><option value="">所有状态</option><option>OPEN</option><option>CLOSED</option><option>MERGED</option></select></div><div id="counts" class="muted"></div><nav id="list"></nav></aside><article id="content" class="content"></article></main>
<script type="application/json" id="data">__DATA__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent);let task='github',selected='issue:1',tab='discussion';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=i=>`${i.kind==='pr'?'PR':'Issue'} #${i.number}`;const time=s=>s?s.replace('T',' ').replace(/\.\d+Z$/,' UTC'):'';
function itemlink(id){const i=DATA[task].items.find(i=>i.node_id===id);return i?`<a class="tag" href="#${task}/${id}">${label(i)} · ${esc(i.title)}</a>`:esc(id)}
function navigate(){const parts=location.hash.slice(1).split('/');if(DATA[parts[0]])task=parts[0];selected=parts[1]||'issue:1';render();if(parts[2])setTimeout(()=>{const e=document.getElementById(parts[2]);if(e){e.scrollIntoView({block:'center'});e.classList.add('flash')}},30)}
function render(){let d=DATA[task],q=$('#search').value.toLowerCase(),kind=$('#kind').value,state=$('#state').value;document.querySelectorAll('[data-task]').forEach(b=>b.classList.toggle('active',b.dataset.task===task));$('#counts').textContent=`${d.items.filter(i=>i.kind==='issue').length} Issues · ${d.items.filter(i=>i.kind==='pr').length} PRs · ${d.comments.length} 评论`;
const filtered=d.items.filter(i=>(!kind||i.kind===kind)&&(!state||i.state===state)&&(!q||[i.title,i.body,i.desired_member_login,...d.comments.filter(c=>c.work_item_node_id===i.node_id).map(c=>c.body+' '+c.author)].join(' ').toLowerCase().includes(q)));
$('#list').innerHTML=filtered.map(i=>`<a class="row ${selected===i.node_id?'selected':''}" href="#${task}/${i.node_id}"><span class="muted">${label(i)} · ${esc(i.state)}</span><strong>${esc(i.title)}</strong><span class="muted">${esc(i.desired_member_login||'未指派')} · ${d.comments.filter(c=>c.work_item_node_id===i.node_id).length} 条评论</span></a>`).join('')||'<p class="empty">无匹配项</p>';
const i=d.items.find(i=>i.node_id===selected)||d.items[0];selected=i.node_id;const comments=d.comments.filter(c=>c.work_item_node_id===i.node_id),related=d.links.filter(l=>l.issue_node_id===i.node_id||l.pr_node_id===i.node_id).map(l=>l.issue_node_id===i.node_id?l.pr_node_id:l.issue_node_id),children=d.items.filter(x=>x.parent_issue===i.node_id),merge=d.merges.find(m=>m.pr_node_id===i.node_id);
$('#content').innerHTML=`<h1>${esc(i.title)} <span class="muted">${label(i)}</span></h1><div class="meta"><span class="badge ${esc(i.state)}">${esc(i.state)}</span><span>负责人 <b>${esc(i.desired_member_login||'未指派')}</b></span><span class="muted">${esc(i.desired_profile_id||'')} · ${comments.length} 条评论</span></div><div class="notice">这是生成 run <a href="https://arc-bench.com/runs/${d.run}" target="_blank" rel="noopener">${d.run}</a> 的保存快照。正文为最终保存版本；不补造编辑历史。投递成功不等于 Agent 已读取。隐藏/解决的内容可展开复审。</div><div class="relations">${i.parent_issue?'父项 '+itemlink(i.parent_issue):''}${children.map(x=>itemlink(x.node_id)).join('')}${related.map(itemlink).join('')}</div>${i.kind==='pr'?`<p><code>${esc(i.head_ref||'未记录')}</code> → <code>${esc(i.base_ref||'未记录')}</code> ${i.draft?'· Draft':''}</p>${merge?`<details><summary>合并记录：${esc(merge.lifecycle)}</summary><pre>${esc(JSON.stringify({base:merge.base_ref,head:merge.head_ref,commit:merge.merge_commit,error:merge.error},null,2))}</pre></details>`:''}`:''}<div class="toolbar"><button data-tab="discussion" class="${tab==='discussion'?'active':''}">讨论</button><button data-tab="activity" class="${tab==='activity'?'active':''}">活动与指派</button><button data-tab="source" class="${tab==='source'?'active':''}">来源</button></div><div id="panel"></div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(tab==='activity'){$('#panel').innerHTML=`<div class="card">${d.activity.filter(a=>a.work_item_node_id===i.node_id).map(a=>`<div class="activity"><b>${esc(a.actor_login)}</b> <span class="tag">${esc(a.action)}</span> ${esc(a.detail)} <div class="muted">${time(a.occurred_at)}</div></div>`).join('')||'<p class="empty">无活动记录</p>'}</div><h3>成员历史</h3>${d.assignments.filter(a=>a.work_item_node_id===i.node_id).map(a=>`<div class="activity">${esc(a.member_login)} · ${esc(a.profile_id)} · ${esc(a.lifecycle)}<div class="muted">${time(a.assigned_at)} → ${time(a.retired_at)||'—'}</div></div>`).join('')}`;return}
if(tab==='source'){$('#panel').innerHTML=`<div class="card body"><p>${esc(d.archive)}</p><p>SHA256 <code>${d.sha256}</code></p><p>数据库：${esc(d.entry)}</p><p>对象更新时间：${time(i.observed_at)}</p><p>未提供 Git diff 与历次正文版本。本页只呈现归档事实。</p><p><a href="data.json" download>下载全部原始展示数据 JSON</a></p></div>`;return}
function comment(c){let deliveries=d.delivery.filter(x=>x.comment_id===c.comment_id),reactions=d.reactions.filter(x=>x.comment_id===c.comment_id);let body=`<div class="body">${c.html||'<em>正文未保留</em>'}</div>`;if(c.lifecycle!=='visible')body=`<details><summary>${esc(c.lifecycle)} · ${esc(c.hide_reason||'未记录理由')}（展开原文）</summary>${body}</details>`;return `<section class="card ${c.reply_to?'reply':''}" id="comment-${c.comment_id}"><div class="card-head"><b>${esc(c.author)}</b><a href="#${task}/${i.node_id}/comment-${c.comment_id}">#${c.comment_id}</a><span class="muted">${time(c.created_at)}${c.revision>1?' · 已编辑 r'+c.revision:''}</span>${c.reply_to?`<a href="#${task}/${i.node_id}/comment-${c.reply_to}">回复 #${c.reply_to}</a>`:''}${c.resolved_through!=null?'<span class="tag">已解决至 #'+c.resolved_through+'</span>':''}</div>${body}${reactions.length?'<div class="body">'+reactions.map(r=>esc(r.expression)+' '+esc(r.actor)).join(' · ')+'</div>':''}${deliveries.length?`<details><summary>投递回执 · ${deliveries.length} 个目标</summary>${deliveries.map(x=>`<div>${esc(x.recipient_login)} · <b>${esc(x.status)}</b> ${esc(x.reason||'')}</div>`).join('')}<p class="muted">这是 Braid 投递状态，不证明原生模型消费。</p></details>`:''}</section>`}
const roots=comments.filter(c=>!c.reply_to),seen=new Set();function thread(c){if(seen.has(c.comment_id))return '';seen.add(c.comment_id);return comment(c)+comments.filter(x=>x.reply_to===c.comment_id).map(thread).join('')}
$('#panel').innerHTML=`<section class="card"><div class="card-head"><b>Description</b><span class="muted">当前保存正文 · revision ${i.revision}</span></div><div class="body">${i.html}</div></section>`+roots.map(thread).join('')+comments.filter(c=>!seen.has(c.comment_id)).map(thread).join('');
}
$('#search').oninput=render;$('#kind').onchange=render;$('#state').onchange=render;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{tab='discussion';location.hash=b.dataset.task+'/issue:1'});window.onhashchange=navigate;navigate();
</script></html>
