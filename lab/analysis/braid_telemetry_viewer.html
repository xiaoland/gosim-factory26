<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Braid · 运行诊断</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        color: #202b36;
        background: #f4f6f9;
        font-size: 14px;
        --muted: #64748b;
        --line: #dce3ec;
        --accent: #3262d9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      summary {
        outline-offset: 3px;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.035em;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 15px;
      }
      p {
        line-height: 1.7;
      }
      .shell {
        display: grid;
        grid-template-columns: 208px 1fr;
        min-height: 100vh;
      }
      aside {
        background: #121e32;
        color: #b5c1d7;
        padding: 30px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        font-size: 25px;
        font-weight: 800;
        color: white;
        letter-spacing: -1px;
        padding: 0 12px;
      }
      .brand small {
        display: block;
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #8aa1c6;
        margin: 8px 0 35px;
      }
      .nav {
        display: grid;
        gap: 7px;
      }
      .nav button {
        border: 0;
        border-radius: 7px;
        text-align: left;
        color: inherit;
        background: transparent;
        padding: 12px;
      }
      .nav button.active {
        background: #284477;
        color: white;
      }
      .nav button:hover {
        background: #223654;
      }
      .aside-note {
        font-size: 11px;
        line-height: 1.7;
        padding: 25px 12px;
        color: #8195b6;
      }
      main {
        padding: 34px 38px 70px;
        max-width: 1600px;
        width: 100%;
        min-width: 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: start;
        border-bottom: 1px solid var(--line);
        padding-bottom: 22px;
        margin-bottom: 24px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--accent);
        font-weight: 800;
        margin-bottom: 9px;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .small {
        font-size: 12px;
      }
      .pill {
        display: inline-block;
        border-radius: 5px;
        padding: 4px 8px;
        background: #e9eef5;
        font-size: 11px;
        white-space: nowrap;
      }
      .pill.warn {
        background: #fff0ce;
        color: #8b5900;
      }
      .pill.ok {
        background: #dff2e8;
        color: #186447;
      }
      .pill.bad {
        background: #fee5e5;
        color: #a33030;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 24px;
      }
      .stat,
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .stat {
        padding: 19px;
      }
      .stat strong {
        display: block;
        font-size: 27px;
        letter-spacing: -0.04em;
        margin-bottom: 4px;
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
      }
      .panel {
        padding: 22px;
        margin-bottom: 18px;
      }
      .notice {
        border-left: 3px solid #dca138;
        background: #fff8e9;
        padding: 13px 17px;
        margin-bottom: 20px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: white;
        padding: 9px 11px;
        min-width: 0;
      }
      input {
        flex: 1;
        min-width: 180px;
      }
      button.standard {
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px 12px;
        color: #334155;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .session-layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 18px;
      }
      .session-list {
        max-height: 76vh;
        overflow: auto;
      }
      .session-option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 13px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: white;
        color: inherit;
        overflow-wrap: anywhere;
      }
      .session-option.active {
        background: #eaf0ff;
        box-shadow: inset 3px 0 var(--accent);
      }
      .session-option .mono {
        font-size: 10px;
        display: block;
        margin: 5px 0;
      }
      .message {
        border: 1px solid var(--line);
        border-left: 3px solid #a5b4cb;
        border-radius: 7px;
        padding: 16px;
        margin: 12px 0;
        background: white;
      }
      .message.assistant {
        border-left-color: #567be0;
      }
      .message.user {
        border-left-color: #459782;
      }
      .message.tool {
        border-left-color: #b086cd;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.65;
        font-size: 13px;
        margin: 14px 0 6px;
      }
      .body.long {
        max-height: 500px;
        overflow: auto;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        color: #52657c;
        font-size: 12px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f5f7fa;
        border-radius: 6px;
        padding: 12px;
        max-height: 450px;
        overflow: auto;
        font-size: 11px;
        line-height: 1.55;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      td,
      th {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 11px;
      }
      td {
        max-width: 500px;
      }
      .empty {
        padding: 38px 16px;
        text-align: center;
        color: var(--muted);
        line-height: 1.8;
      }
      .trace-row {
        display: grid;
        grid-template-columns: minmax(160px, 32%) 1fr 85px;
        gap: 15px;
        align-items: center;
        border-bottom: 1px solid #edf0f6;
        padding: 12px 0;
      }
      .track {
        height: 20px;
        background: #f0f3f8;
        border-radius: 3px;
        position: relative;
      }
      .span-bar {
        background: #7194ec;
        height: 100%;
        min-width: 2px;
        border-radius: 3px;
        position: absolute;
      }
      .span-bar.bad {
        background: #db7979;
      }
      .chart {
        width: 100%;
        height: 120px;
        margin: 14px 0;
      }
      .metric-label {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .links {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
      }
      .section[hidden] {
        display: none;
      }
      .badge-note {
        display: block;
        margin-top: 6px;
      }
      .object {
        scroll-margin-top: 20px;
      }
      .comment {
        border-top: 1px solid var(--line);
        padding-top: 15px;
        margin-top: 20px;
      }
      .metric-series {
        border-top: 1px solid var(--line);
        padding-top: 15px;
        margin-top: 15px;
      }
      @media (max-width: 1000px) {
        main {
          padding: 25px 20px;
        }
        .shell {
          grid-template-columns: 170px 1fr;
        }
        .session-layout {
          grid-template-columns: 200px 1fr;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 720px) {
        .shell {
          display: block;
        }
        aside {
          position: static;
          height: auto;
          padding: 18px;
        }
        .brand small,
        .aside-note {
          display: none;
        }
        .brand {
          font-size: 21px;
          margin-bottom: 12px;
        }
        .nav {
          display: flex;
          overflow: auto;
          gap: 3px;
        }
        .nav button {
          white-space: nowrap;
          padding: 9px;
        }
        .top {
          display: block;
        }
        .top > div:last-child {
          margin-top: 12px;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .session-layout {
          grid-template-columns: 1fr;
        }
        .session-list {
          max-height: 210px;
        }
        .trace-row {
          grid-template-columns: 130px 1fr 65px;
          gap: 8px;
        }
        main {
          padding: 23px 14px;
        }
        .panel {
          padding: 16px;
        }
      }
      /* Source Markdown is rendered by Comrak; these styles cover prose, not raw telemetry. */
      .markdown-body {
        font-size: 14px;
        line-height: 1.7;
        overflow-wrap: anywhere;
        color: #1f2328;
      }
      .markdown-body > :first-child {
        margin-top: 0;
      }
      .markdown-body > :last-child {
        margin-bottom: 0;
      }
      .markdown-body h1,
      .markdown-body h2 {
        font-size: 21px;
        padding-bottom: 9px;
        border-bottom: 1px solid #d8dee4;
        margin: 24px 0 16px;
        letter-spacing: normal;
      }
      .markdown-body h3 {
        font-size: 17px;
        margin: 20px 0 12px;
      }
      .markdown-body p {
        margin: 0 0 16px;
      }
      .markdown-body ul,
      .markdown-body ol {
        padding-left: 25px;
        margin: 0 0 16px;
      }
      .markdown-body li + li {
        margin-top: 4px;
      }
      .markdown-body li > p {
        margin: 8px 0;
      }
      .markdown-body blockquote {
        border-left: 4px solid #d0d7de;
        color: #656d76;
        padding: 0 16px;
        margin: 16px 0;
      }
      .markdown-body code {
        font:
          12px ui-monospace,
          SFMono-Regular,
          monospace;
        background: #afb8c133;
        border-radius: 5px;
        padding: 2px 5px;
      }
      .markdown-body pre {
        background: #f6f8fa;
        margin: 14px 0;
        padding: 16px;
        max-height: 600px;
        line-height: 1.6;
      }
      .markdown-body pre code {
        background: none;
        padding: 0;
        white-space: pre-wrap;
      }
      .markdown-body table {
        display: block;
        overflow: auto;
        width: max-content;
        max-width: 100%;
        margin: 16px 0;
      }
      .markdown-body td,
      .markdown-body th {
        border: 1px solid #d0d7de;
        padding: 7px 13px;
      }
      .markdown-body tr:nth-child(2n) {
        background: #f6f8fa;
      }
      .markdown-body input[type="checkbox"] {
        min-width: 0;
        width: 13px;
        height: 13px;
        margin: 0 6px 0 -18px;
        padding: 0;
        accent-color: #1f883d;
      }
      .markdown-body hr {
        height: 2px;
        background: #d8dee4;
        border: 0;
        margin: 24px 0;
      }
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #dde8fb;
        color: #315c9a;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid #cbd8ed;
      }
      .avatar.user {
        background: #e1f0e8;
        color: #287357;
        border-color: #c5dfd1;
      }
      .avatar.tool {
        background: #eef0f4;
        color: #596477;
        border-color: #d8dfe8;
      }
      .chat-thread {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        min-width: 0;
        overflow: hidden;
      }
      .chat-thread-header {
        padding: 20px 26px;
        border-bottom: 1px solid #e8ecf1;
      }
      .chat-thread-header h2 {
        display: inline-block;
        margin: 0 12px 8px 0;
        font-size: 17px;
      }
      .chat-thread-header > a {
        float: right;
        font-size: 12px;
      }
      .chat-thread-header details {
        margin-top: 5px;
      }
      .chat-messages {
        padding: 10px 26px;
      }
      .chat-message {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 26px 0;
      }
      .chat-main {
        min-width: 0;
        max-width: calc(100% - 44px);
        flex: 1;
      }
      .chat-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        margin: 0 0 10px;
      }
      .chat-meta .small {
        font-size: 10px;
      }
      .chat-bubble {
        min-width: 0;
      }
      .chat-message.user {
        flex-direction: row-reverse;
      }
      .chat-message.user .chat-main {
        flex: 0 1 88%;
      }
      .chat-message.user .chat-meta {
        justify-content: flex-end;
      }
      .chat-message.user .chat-bubble {
        background: #edf3fa;
        border: 1px solid #e1e8f0;
        border-radius: 15px 3px 15px 15px;
        padding: 17px 19px;
      }
      .chat-message.assistant .chat-bubble {
        padding: 4px 0;
      }
      .chat-message.tool {
        margin: 15px 0;
      }
      .chat-message.tool .chat-meta {
        margin-bottom: 5px;
      }
      .chat-event {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 12px;
        margin: 12px 0;
        color: #798698;
        font-size: 11px;
        background: #f8fafc;
        border-radius: 6px;
      }
      .chat-event strong {
        font-weight: 500;
      }
      .chat-event details {
        width: 100%;
        margin: 0;
        text-align: center;
      }
      .chat-event details pre {
        text-align: left;
      }
      .chat-event summary {
        font-size: 10px;
      }
      .message-source {
        margin-top: 10px;
      }
      .message-source > summary {
        font-size: 10px;
        color: #8a97a8;
      }
      .message-source pre {
        text-align: left;
      }
      .chat-thread > .pager {
        border-top: 1px solid #e8ecf1;
        padding: 15px 22px;
        margin: 0;
      }
      .thought {
        border-left: 2px solid #c9d4e2;
        padding-left: 13px;
        margin: 0 0 16px;
      }
      .thought summary {
        color: #7c8798;
        margin-bottom: 8px;
      }
      .thought .markdown-body {
        color: #64748b;
        font-size: 12px;
      }
      .tool-card {
        border: 1px solid #dce3eb;
        border-radius: 8px;
        background: #fafbfc;
        margin: 10px 0;
        overflow: hidden;
      }
      .tool-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 13px;
        background: #f3f5f8;
        list-style: none;
      }
      .tool-heading:after {
        content: "展开";
        margin-left: auto;
        font-size: 10px;
        color: #8490a1;
      }
      .tool-card[open] > .tool-heading:after {
        content: "收起";
      }
      .tool-icon {
        color: #596f91;
        font-size: 15px;
      }
      .tool-error {
        border-color: #e9b5b5;
      }
      .tool-error > .tool-heading {
        background: #fff0f0;
        color: #ac2f35;
      }
      .tool-card > button {
        margin: 10px 13px;
        font-size: 11px;
        padding: 5px 8px;
      }
      .tool-code {
        border-radius: 0;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          monospace;
        background: transparent;
        margin: 0;
        padding: 12px 14px;
        max-height: 380px;
      }
      .tool-field + .tool-field {
        border-top: 1px solid #e4e9f0;
      }
      .tool-field-label {
        display: block;
        padding: 10px 14px 0;
        text-transform: uppercase;
        font-size: 9px;
        letter-spacing: 0.06em;
        color: #6d7d94;
      }
      .tool-field .tool-code {
        padding-top: 6px;
      }
      .attachment {
        display: block;
        padding: 12px;
        border: 1px dashed #cbd5e1;
        border-radius: 6px;
        color: #64748b;
        font-size: 12px;
      }
      .github-view {
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 24px;
        color: #1f2328;
      }
      .gh-tabs {
        display: flex;
        gap: 6px;
        border-bottom: 1px solid #d0d7de;
        margin: 0 0 22px;
        overflow: auto;
      }
      .gh-tabs button.gh-tab {
        background: transparent;
        border: 0;
        border-radius: 0;
        border-bottom: 2px solid transparent;
        padding: 14px 13px;
        white-space: nowrap;
        color: #1f2328;
      }
      .gh-tabs button.gh-tab.selected {
        border-bottom-color: #fd8c73;
        font-weight: 650;
      }
      .gh-tabs button.gh-tab:hover {
        background: #f6f8fa;
      }
      .gh-issue-list {
        border: 1px solid #d0d7de;
        border-radius: 6px;
        overflow: hidden;
      }
      .gh-list-header {
        background: #f6f8fa;
        padding: 16px;
        font-size: 13px;
        font-weight: 600;
        border-bottom: 1px solid #d0d7de;
      }
      .gh-issue-row {
        display: flex;
        width: 100%;
        gap: 14px;
        align-items: flex-start;
        border: 0;
        border-bottom: 1px solid #d8dee4;
        background: #fff;
        text-align: left;
        padding: 17px;
        color: #1f2328;
      }
      .gh-issue-row:last-child {
        border-bottom: 0;
      }
      .gh-issue-row:hover {
        background: #f6f8fa;
      }
      .gh-issue-info {
        flex: 1;
        display: grid;
        gap: 7px;
      }
      .gh-issue-info strong {
        font-size: 15px;
      }
      .gh-state-icon {
        font-size: 20px;
        line-height: 1;
      }
      .gh-state-icon.open {
        color: #1a7f37;
      }
      .gh-state-icon.merged,
      .gh-state-icon.closed {
        color: #8250df;
      }
      .gh-state-icon.closed-pr {
        color: #cf222e;
      }
      .gh-title {
        margin: 22px 0;
      }
      .gh-title h1 {
        font-size: 28px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: normal;
      }
      .gh-number {
        color: #656d76;
        font-weight: 300;
      }
      .gh-state {
        border-radius: 20px;
        padding: 7px 13px;
        font-weight: 600;
        font-size: 13px;
        color: white;
        background: #656d76;
      }
      .gh-state.open {
        background: #1f883d;
      }
      .gh-state.merged,
      .gh-state.closed {
        background: #8250df;
      }
      .gh-state.closed-pr {
        background: #cf222e;
      }
      .gh-branches {
        margin: 14px 0 0;
        font:
          12px ui-monospace,
          SFMono-Regular,
          monospace;
        color: #596579;
        overflow-wrap: anywhere;
      }
      .gh-detail-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 215px;
        gap: 26px;
      }
      .gh-timeline {
        min-width: 0;
        position: relative;
      }
      .gh-timeline-item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        position: relative;
        margin-bottom: 22px;
      }
      .gh-timeline-item:before {
        content: "";
        position: absolute;
        left: 15px;
        top: 33px;
        bottom: -23px;
        border-left: 2px solid #d8dee4;
      }
      .gh-timeline-item > .avatar {
        z-index: 1;
      }
      .gh-comment {
        flex: 1;

  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          braid<span style="color: #7194ec">.</span
          ><small>RUN DIAGNOSTICS</small>
        </div>
        <nav class="nav" aria-label="诊断视图"></nav>
        <p class="aside-note">
          实验 OTLP Backend<br />离线静态快照<br />正文按原始证据保留
        </p>
      </aside>
      <main>
        <header class="top">
          <div>
            <div class="eyebrow">EXPERIMENT / OBSERVABILITY</div>
            <h1>运行诊断</h1>
            <div id="run-label" class="mono muted"></div>
          </div>
          <div id="header-status"></div>
        </header>
        <div id="content"></div>
      </main>
    </div>
    <script id="report-data" type="application/json">
      /*REPORT_DATA*/
    </script>
    <script>
      "use strict";
      const D = JSON.parse(document.getElementById("report-data").textContent);
      const $ = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = String(text);
        return e;
      };
      const append = (p, ...children) => {
        for (const c of children) if (c) p.append(c);
        return p;
      };
      const pretty = (v) => JSON.stringify(v, null, 2),
        rows = (name) => D.objects[name]?.rows || [];
      const val = (v) => {
        if (!v) return null;
        for (const k of [
          "stringValue",
          "intValue",
          "doubleValue",
          "boolValue",
          "bytesValue",
        ])
          if (k in v) return v[k];
        if (v.arrayValue) return v.arrayValue.values.map(val);
        if (v.kvlistValue) return attrs(v.kvlistValue.values);
        return v;
      };
      const attrs = (a) =>
        Object.fromEntries((a || []).map((v) => [v.key, val(v.value)]));
      const raw = (v, label = "原始记录") =>
        append($("details"), $("summary", "", label), $("pre", "", pretty(v)));
      const pill = (text, kind = "") => $("span", "pill " + kind, text);
      const link = (href, label) => {
        const a = $("a", "", label);
        a.href = href;
        return a;
      };
      const empty = (p, text) => p.append($("div", "empty", text));
      const note = (p, text) => p.append($("p", "muted small", text));
      const button = (label, fn) => {
        const b = $("button", "standard", label);
        b.onclick = fn;
        return b;
      };
      const input = (label, placeholder) => {
        const e = $("input");
        e.type = "search";
        e.placeholder = placeholder;
        e.setAttribute("aria-label", label);
        return e;
      };
      const ns = (v) => {
        try {
          return BigInt(v || 0);
        } catch {
          return 0n;
        }
      };
      const when = (v) => {
        if (!v || ns(v) === 0n) return "时间未知";
        const t = new Date(Number(ns(v) / 1000000n));
        return Number.isNaN(t.valueOf())
          ? "时间未知"
          : t.toISOString().replace("T", " ").replace("Z", " UTC");
      };
      const duration = (end, start) => Number(ns(end) - ns(start)) / 1e6;
      const table = (headers, entries) => {
        const t = $("table"),
          head = $("tr");
        headers.forEach((v) => head.append($("th", "", v)));
        t.append(append($("thead"), head));
        const body = $("tbody");
        for (const row of entries) {
          const tr = $("tr");
          for (const cell of row)
            tr.append(
              append(
                $("td"),
                cell instanceof Node ? cell : $("span", "", cell ?? "未知"),
              ),
            );
          body.append(tr);
        }
        t.append(body);
        return append($("div", "table-wrap"), t);
      };
      const panel = (title) =>
        append($("section", "panel"), $("h2", "", title));
      const nav = document.querySelector(".nav"),
        content = document.getElementById("content"),
        views = {};
      const viewSpecs = [
        ["overview", "总览"],
        ["sessions", "会话消息"],
        ["profile", "Token 与耗时"],
        ["objects", "Issue / PR"],
        ["traces", "Traces"],
        ["metrics", "Metrics"],
        ["logs", "运行日志"],
        ["evidence", "证据与缺口"],
      ];
      for (const [id, title] of viewSpecs) {
        const b = $("button", "", title);
        b.onclick = () => show(id);
        b.dataset.view = id;
        nav.append(b);
        const section = $("section", "section");
        section.hidden = true;
        views[id] = section;
        content.append(section);
      }
      function show(id) {
        if (!views[id]) id = "overview";
        for (const [key, node] of Object.entries(views))
          node.hidden = key !== id;
        for (const b of nav.children) {
          b.classList.toggle("active", b.dataset.view === id);
          b.setAttribute(
            "aria-current",
            b.dataset.view === id ? "page" : "false",
          );
        }
        if (!views[id].dataset.ready) {
          renderers[id](views[id]);
          views[id].dataset.ready = "1";
        }
        location.hash = id;
      }
      document.getElementById("run-label").textContent = D.braid_run_id;
      const hs = document.getElementById("header-status");
      hs.append(
        pill(
          "证据 " + D.manifest.status,
          D.manifest.status === "complete" ? "ok" : "warn",
        ),
      );
      hs.append(
        $(
          "span",
          "badge-note muted small",
          "业务终态 " + (D.terminal?.status || "未知"),
        ),
      );
      function overview(p) {
        const stats = $("div", "stats");
        for (const [number, label] of [
          [D.sessions.length, "原生会话"],
          [D.sessions.reduce((n, s) => n + s.entries.length, 0), "原生条目"],
          [rows("local_items").length, "Issue / PR"],
          [D.diagnostics.spans.length, "已采集 span"],
        ])
          stats.append(
            append(
              $("div", "stat"),
              $("strong", "", number),
              $("span", "", label),
            ),
          );
        p.append(stats);
        if (D.manifest.gaps.length)
          p.append(
            $(
              "div",
              "notice",
              "存在诊断缺口。当前页面仅展示 Backend 已接收并可重建的内容，详细缺口见“证据与缺口”。",
            ),
          );
        const grid = $("div", "grid"),
          identity = panel("运行身份"),
          signals = panel("遥测来源");
        identity.append(
          table(
            ["归属", "值"],
            [
              ["实验 run", D.experiment.run_id || "未归档实验身份"],
              ["Braid run", D.braid_run_id],
              [
                "组合 / 题目",
                [
                  D.experiment.variant,
                  D.experiment.competition,
                  D.experiment.task,
                ]
                  .filter(Boolean)
                  .join(" / ") || "未知",
              ],
              ["实验阶段", D.experiment.phase || "未知"],
              ["业务结果", D.terminal?.status || "未知"],
              ["生成时间", D.generated_at],
            ],
          ),
        );
        signals.append(
          table(
            ["信号", "Backend 批次"],
            ["logs", "traces", "metrics"].map((k) => [k, D.signals[k] || 0]),
          ),
        );
        note(
          signals,
          "批次数包含本实验全部服务；各诊断视图仅显示当前 Braid run。证据正文承载于 logs。",
        );
        signals.append(
          append(
            $("div", "links"),
            link("batches.json", "批次清单"),
            link("decoded.json", "原始三信号 JSON"),
          ),
        );
        append(grid, identity, signals);
        p.append(grid);
        if (
          D.diagnostics.spans.length &&
          D.diagnostics.spans.every(
            (v) => v.record.name === "braid.telemetry.export",
          )
        )
          p.append(
            $(
              "div",
              "notice",
              "本批次只有离线导出操作的 trace / metrics，不包含历史模型执行的实时 trace；会话和对象来自已导出的证据。",
            ),
          );
        const events = panel("Braid 事件时间线");
        note(
          events,
          "使用 Braid 已记录事件，不按 collector 到达时间推断并发因果。",
        );
        const list = rows("events")
          .slice()
          .sort((a, b) =>
            String(a.observed_at).localeCompare(String(b.observed_at)),
          );
        let count = 0;
        const holder = $("div");
        function more() {
          for (const e of list.slice(count, count + 50))
            holder.append(
              append(
                $("details"),
                $(
                  "summary",
                  "",
                  `${e.observed_at} · ${e.kind} · ${e.work_item_node_id}`,
                ),
                $("p", "body", e.reference || ""),
                $("pre", "", pretty(e)),
              ),
            );
          count += 50;
          next.hidden = count >= list.length;
        }
        const next = button("继续显示事件", more);
        append(events, holder, next);
        more();
        if (!list.length) empty(events, "没有可恢复事件");
        p.append(events);
      }
      function profile(p) {
        const profile = D.profile;
        if (!profile) {
          note(p, D.profile_error || "没有找到对应生成目录的 Pi 记录；此视图没有 token 与 Pi 回调时间数据。");
          return;
        }
        note(p, `原生材料 ${profile.coverage.native_manifest}；Pi 时间事件 ${profile.coverage.timing_events}；未结束请求 ${profile.coverage.open_requests}，未结束工具 ${profile.coverage.open_tools}。运行中用量仅覆盖已有消息，未结束请求用量未知。Pi input 与 cacheRead 分列；它们不是供应商账单或缓存命中证明。模型时间从请求发出到最终消息，首增量是客户端可见延迟；并发区间不相加为总墙钟。`);
        if (profile.coverage.gaps.length) note(p, `剖面缺口：${profile.coverage.gaps.join("；")}`);
        p.append(append($("p"), link("profile.json", "下载机器可读剖面")));
        const summary = panel("运行时间与已知用量");
        summary.append(table(["口径", "值"], [
          ["生成墙钟 ms", profile.summary.run_wall_ms],
          ["已观测活动区间并集 ms", profile.summary.observed_active_union_ms],
          ["模型调用累计 ms", profile.summary.request_sum_ms],
          ["工具执行累计 ms", profile.summary.tool_sum_ms],
          ["assistant 消息", profile.summary.messages],
          ["费用", "未知（无本地价格口径）"],
        ]));
        p.append(summary);
        const models = panel("按模型汇总");
        models.append(table(["实际模型 / provider", "Braid 成员 / 原生主会话 / Pi 子会话", "成功 / 错误消息", "输入", "输出", "缓存读", "缓存写", "请求完成/总数", "调用累计 ms", "活动并集 ms"],
          profile.models.map((row) => [`${row.model} / ${row.provider}`, `${row.braid_members ?? "未知"} / ${row.braid_sessions} / ${row.pi_subagent_sessions}`, `${row.successful_messages} / ${row.error_messages}`,
            row.tokens.input, row.tokens.output,
            row.tokens.cacheRead, row.tokens.cacheWrite,
            `${row.completed_requests}/${row.requests}`, row.request_sum_ms, row.observed_active_union_ms])));
        p.append(models);
        const sessions = panel("按原生会话汇总");
        sessions.append(table(["会话", "类别", "成员", "工作项", "角色 / 父会话", "消息", "输入", "输出", "模型 ms", "工具 ms", "活动并集 ms"],
          profile.sessions.map((row) => [row.session_id, row.session_kind, row.profile_id, row.work_item_id,
            [row.native_role, row.parent_native_session_id || row.native_parent].filter(Boolean).join(" / ") || null,
            row.messages, row.tokens.input, row.tokens.output, row.request_sum_ms,
            row.tool_sum_ms, row.observed_active_union_ms])));
        p.append(sessions);
        const token = (row, key) => row.tokens[key] === null ? "未知" :
          `${row.tokens[key]} / ${row.known_messages[key]} 条已知`;
        const usage = panel("原生 assistant usage");
        usage.append(table(["会话", "实际模型 / provider", "结果", "消息", "输入", "输出", "缓存读", "缓存写", "推理"],
          profile.usage.map((row) => [row.session_id, `${row.model} / ${row.provider}`, row.outcome, row.messages,
            ...["input", "output", "cacheRead", "cacheWrite", "reasoning"].map((key) => token(row, key))])));
        p.append(usage);
        const requests = panel("模型调用");
        requests.append(table(["会话", "实际模型 / provider", "请求", "请求→首增量 ms", "请求→结束 ms"],
          profile.requests.map((row) => [row.session_id, `${row.model} / ${row.provider}`, row.request_id,
            row.time_to_first_update_ms, row.duration_ms])));
        p.append(requests);
        const tools = panel("工具执行");
        tools.append(table(["会话", "工具", "调用", "耗时 ms", "错误"],
          profile.tools.map((row) => [row.session_id, row.tool_name, row.tool_call_id,
            row.duration_ms, row.is_error])));
        p.append(tools);
      }
      function markdown(text) {
        const box = $("div", "markdown-body");
        const html = Object.hasOwn(D.markdown || {}, text)
          ? D.markdown[text]
          : undefined;
        if (html === undefined) {
          box.textContent = text ?? "";
          return box;
        }
        // Only Comrak-generated markup enters this sink; raw source HTML is escaped upstream.
        const fragment = document.createElement("template");
        fragment.innerHTML = html;
        for (const image of fragment.content.querySelectorAll("img")) {
          image.replaceWith(
            $(
              "span",
              "attachment",
              "图片附件 · " + (image.alt || "原始记录中查看"),
            ),
          );
        }
        for (const a of fragment.content.querySelectorAll("a")) {
          const href = a.getAttribute("href") || "";
          if (!/^(https?:|mailto:)/i.test(href)) a.removeAttribute("href");
          else {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
        }
        box.append(fragment.content);
        return box;
      }
      function actor(id) {
        const agent = rows("agent_instances").find((a) => a.agent_id === id);
        return (
          agent?.profile_id || (id ? String(id).slice(0, 12) : "未记录作者")
        );
      }
      const avatar = (name, role = "") =>
        $(
          "span",
          "avatar " + role,
          String(name || "?")
            .slice(0, 2)
            .toUpperCase(),
        );
      function presentation(entry) {
        const m = entry.message || entry.payload || entry;
        let role = m.role || "event",
          blocks = [];
        const type = m.type || entry.type;
        if (
          [
            "toolResult",
            "function_call_output",
            "custom_tool_call_output",
          ].includes(m.role || type)
        )
          role = "tool";
        if (["function_call", "custom_tool_call"].includes(type)) {
          role = "assistant";
          blocks.push({
            type: "toolCall",
            name: m.name,
            id: m.call_id || m.id,
            arguments: m.arguments ?? m.input,
          });
        } else if (type === "reasoning") {
          role = "assistant";
          blocks = (m.summary || m.content || []).map((b) => ({
            type: "thinking",
            thinking: b.text || "",
          }));
        } else if (typeof m.content === "string")
          blocks = [{ type: "text", text: m.content }];
        else if (Array.isArray(m.content))
          blocks = m.content.map((b) =>
            typeof b === "string" ? { type: "text", text: b } : b,
          );
        else if (m.output !== undefined)
          blocks = [
            {
              type: "text",
              text: typeof m.output === "string" ? m.output : pretty(m.output),
            },
          ];
        else if (m.text) blocks = [{ type: "text", text: m.text }];
        else if (typeof m.message === "string")
          blocks = [{ type: "text", text: m.message }];
        const eventNames = {
          session: "会话开始",
          session_meta: "会话开始",
          model_change: "切换模型",
          thinking_level_change: "调整思考强度",
          compaction: "上下文压缩",
          branch_summary: "分支摘要",
          session_info: "会话信息",
          turn_context: "轮次上下文",
        };
        const eventTitle =
          eventNames[entry.type] ||
          (entry.type === "event_msg" ? m.type : entry.type) ||
          "原生事件";
        const eventText = [
          m.provider,
          m.modelId || m.model,
          m.thinkingLevel,
          m.summary,
        ]
          .filter((v) => typeof v === "string")
          .join(" · ");
        return {
          role,
          blocks,
          type,
          eventTitle,
          eventText,
          time: entry.timestamp || m.timestamp || "",
          call: m.toolCallId || m.call_id || "",
          id: entry.id || "",
          parent: entry.parentId || "",
          error: m.isError === true,
          name: m.toolName || m.name || "",
        };
      }
      function toolArguments(arguments_) {
        let args = arguments_;
        if (typeof args === "string") {
          try {
            args = JSON.parse(args);
          } catch {
            return $("pre", "tool-code", args);
          }
        }
        if (!args || typeof args !== "object")
          return $("pre", "tool-code", String(args ?? "无参数"));
        const fields = $("div", "tool-fields");
        for (const [name, value] of Object.entries(args)) {
          const field = $("div", "tool-field");
          append(
            field,
            $("span", "tool-field-label", name),
            $(
              "pre",
              "tool-code",
              typeof value === "string" ? value : pretty(value),
            ),
          );
          fields.append(field);
        }
        return fields;
      }
      function chatCard(e, meta, locate) {
        const m = e.p;
        if (m.role === "event") {
          const event = $("article", "chat-event");
          append(
            event,
            $("div", "event-rule"),
            $("span", "event-dot", "·"),

              seen.add(parent);
              depth++;
              parent = known.get(parent).parentSpanId;
            }
            const row = $("div", "trace-row"),
              title = $("div", "mono", r.name);
            title.style.paddingLeft = Math.min(depth, 8) * 12 + "px";
            const track = $("div", "track"),
              bar = $("div", "span-bar" + (r.status?.code === 2 ? " bad" : ""));
            bar.style.left =
              Math.max(
                0,
                (Number(ns(r.startTimeUnixNano) - start) / range) * 100,
              ) + "%";
            bar.style.width =
              Math.max(
                0.3,
                (Number(ns(r.endTimeUnixNano) - ns(r.startTimeUnixNano)) /
                  range) *
                  100,
              ) + "%";
            track.append(bar);
            append(
              row,
              title,
              track,
              $(
                "span",
                "mono",
                duration(r.endTimeUnixNano, r.startTimeUnixNano).toFixed(2) +
                  " ms",
              ),
            );
            card.append(row);
            if (r.parentSpanId && !known.has(r.parentSpanId))
              note(card, "父 span 未接收：" + r.parentSpanId);
            card.append(raw(item, "span 属性与事件"));
          }
          p.append(card);
        }
      }
      function chart(points) {
        const finite = points.filter((p) => Number.isFinite(p[1]));
        if (!finite.length) return $("p", "muted small", "没有可绘制的数值点");
        const nsuri = "http://www.w3.org/2000/svg",
          svg = document.createElementNS(nsuri, "svg");
        svg.setAttribute("viewBox", "0 0 600 120");
        svg.classList.add("chart");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", "按实际时间绘制的指标观测值");
        let min = Infinity,
          max = -Infinity,
          start = Infinity,
          end = -Infinity;
        for (const [t, v] of finite) {
          min = Math.min(min, v);
          max = Math.max(max, v);
          start = Math.min(start, t);
          end = Math.max(end, t);
        }
        const xy = finite.map((p) => [
          20 + ((p[0] - start) / Math.max(1, end - start)) * 560,
          100 - ((p[1] - min) / (max - min || 1)) * 80,
        ]);
        const line = document.createElementNS(nsuri, "polyline");
        line.setAttribute("points", xy.map((p) => p.join(",")).join(" "));
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", "#527fdf");
        line.setAttribute("stroke-width", "2");
        svg.append(line);
        for (let i = 0; i < xy.length; i++) {
          const c = document.createElementNS(nsuri, "circle");
          c.setAttribute("cx", xy[i][0]);
          c.setAttribute("cy", xy[i][1]);
          c.setAttribute("r", "3");
          c.setAttribute("fill", "#3262d9");
          const title = document.createElementNS(nsuri, "title");
          title.textContent = String(finite[i][1]);
          c.append(title);
          svg.append(c);
        }
        return svg;
      }
      function metrics(p) {
        note(
          p,
          "按 resource、scope 与属性区分序列。累计值不跨 runtime 求和；直方图保留桶和计数，图中仅展示 sum/count 的均值。",
        );
        const groups = new Map();
        for (const item of D.diagnostics.metrics) {
          const m = item.record;
          const kind = [
            "gauge",
            "sum",
            "histogram",
            "exponentialHistogram",
            "summary",
          ].find((k) => m[k]);
          if (!kind) continue;
          for (const point of m[kind].dataPoints || []) {
            const labels = attrs(point.attributes),
              key = pretty([
                item.resource,
                item.scope,
                m.name,
                m.unit,
                kind,
                m[kind].aggregationTemporality,
                labels,
              ]);
            if (!groups.has(key))
              groups.set(key, { item, kind, labels, points: [] });
            groups.get(key).points.push(point);
          }
        }
        if (!groups.size) empty(p, "Backend 未接收到本运行的 metrics");
        for (const { item, kind, labels, points } of groups.values()) {
          const m = item.record;
          points.sort((a, b) =>
            ns(a.timeUnixNano) < ns(b.timeUnixNano) ? -1 : 1,
          );
          const card = panel(m.name);
          append(card, pill(kind), $("p", "metric-label mono", pretty(labels)));
          note(
            card,
            `实例 ${item.resource["service.instance.id"] || "未知"} · 单位 ${m.unit || "无"} · ${m[kind].aggregationTemporality === 2 ? "累计" : m[kind].aggregationTemporality === 1 ? "增量" : "即时/未知"}`,
          );
          const y = (v) =>
            v.flags & 1
              ? NaN
              : v.asInt !== undefined
                ? Number(v.asInt)
                : v.asDouble !== undefined
                  ? Number(v.asDouble)
                  : v.sum !== undefined && Number(v.count) > 0
                    ? Number(v.sum) / Number(v.count)
                    : NaN;
          card.append(
            chart(
              points.map((v) => [Number(ns(v.timeUnixNano) / 1000000n), y(v)]),
            ),
          );
          card.append(
            table(
              ["时间", "观测值 / 均值", "计数"],
              points.map((v) => [
                when(v.timeUnixNano),
                Number.isFinite(y(v))
                  ? (v.asInt ?? v.asDouble ?? y(v))
                  : "未报告",
                v.count ?? "—",
              ]),
            ),
          );
          card.append(
            raw(
              { resource: item.resource, scope: item.scope, metric: m, points },
              "完整指标、桶与原始点",
            ),
          );
          p.append(card);
        }
      }
      function logs(p) {
        const search = input("搜索运行日志", "搜索日志、错误、trace ID…");
        p.append(append($("div", "toolbar"), search));
        const list = $("div"),
          more = button("显示更多日志", () => {
            limit += 100;
            draw();
          });
        append(p, list, more);
        let limit = 100;
        function draw() {
          list.replaceChildren();
          const entries = D.diagnostics.logs.filter((v) =>
            pretty(v).toLowerCase().includes(search.value.toLowerCase()),
          );
          for (const item of entries.slice(0, limit)) {
            const r = item.record,
              card = $("article", "message");
            append(
              card,
              append(
                $("div", "row"),
                pill(
                  r.severityText || r.severityNumber || "INFO",
                  r.severityNumber >= 17 ? "bad" : "",
                ),
                $(
                  "span",
                  "muted small",
                  when(r.timeUnixNano || r.observedTimeUnixNano),
                ),
              ),
              $(
                "div",
                "body",
                typeof val(r.body) === "string"
                  ? val(r.body)
                  : pretty(val(r.body)),
              ),
              raw(item),
            );
            list.append(card);
          }
          more.hidden = limit >= entries.length;
          if (!entries.length)
            empty(
              list,
              "没有匹配的运行日志。证据传输日志已用于重建，不重复铺在此处。",
            );
        }
        search.oninput = () => {
          limit = 100;
          draw();
        };
        draw();
      }
      function evidence(p) {
        const gaps = panel("完整性与缺口");
        gaps.append(
          pill(
            D.manifest.status,
            D.manifest.status === "complete" ? "ok" : "warn",
          ),
        );
        for (const gap of D.manifest.gaps) gaps.append($("p", "notice", gap));
        for (const error of D.diagnostics.errors)
          gaps.append($("p", "notice", `${error.file}: ${error.error}`));
        if (D.source_errors?.length) {
          note(gaps, "源端记录了错误或警告；OTLP capture 超时的批次是否丢失未知，Backend 已收批次与重建结果不证明源端完整。");
          for (const error of D.source_errors)
            gaps.append(append($("p", "notice"),
              link(error.file, `${error.source}:${error.line ?? "更早"}`),
              ` ${error.message}`));
        }
        if (!D.manifest.gaps.length && !D.diagnostics.errors.length && !D.source_errors?.length)
          note(
            gaps,
            "所选源清单、片段和摘要校验通过；这不证明源端未记录的内容存在。",
          );
        p.append(gaps);
        const downloads = panel("证据下载");
        note(
          downloads,
          "来自本实验 Backend 的原始批次以及当前 Braid run 的重建文件。保留完整正文，按原始运行材料管理。",
        );
        downloads.append(
          append(
            $("div", "links"),
            link("batches.json", "Backend 批次清单"),
            link("decoded.json", "OTLP JSON"),
            link("reconstruction.json", "重建报告"),
            link("reconstruction.stderr.log", "重建错误"),
          ),
        );
        downloads.append(
          table(
            ["源文件", "类型", "字节", "下载"],
            D.manifest.artifacts.map((a) => [
              a.source,
              a.logical_type,
              a.bytes,
              link("evidence/" + a.file, a.file),
            ]),
          ),
        );
        downloads.append(raw(D.manifest, "完整摘要与源文件映射"));
        p.append(downloads);
        const batch = panel("Backend 批次");
        batch.append(
          table(
            ["批次", "信号", "接收时间", "字节"],
            D.batches.map((b) => [
              link(b.file, String(b.id)),
              b.signal,
              new Date(b.received_at * 1000).toISOString(),
              b.bytes,
            ]),
          ),
        );
        p.append(batch);
      }
      const renderers = {
        overview,
        sessions,
        profile,
        objects,
        traces,
        metrics,
        logs,
        evidence,
      };
      show(location.hash.slice(1));
      window.addEventListener("hashchange", () => show(location.hash.slice(1)));
    </script>
  </body>
</html>
