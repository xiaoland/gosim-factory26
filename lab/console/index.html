<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory26 · Braid 人工介入实验</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#24292f;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}header{background:#24292f;color:#fff;padding:15px max(22px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:18px}header select{background:#fff;color:#24292f;padding:8px;border-radius:6px;max-width:48vw}.wrap{max-width:1260px;margin:30px auto;padding:0 20px}.banner{background:#fff8c5;border:1px solid #eac54f;border-radius:6px;padding:10px 14px;margin-bottom:16px;font-weight:600}.layout{display:grid;grid-template-columns:minmax(280px,370px) minmax(0,1fr);gap:20px}.panel{background:#fff;border:1px solid #d0d7de;border-radius:7px;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid #d8dee4}.panel-head h1{font-size:17px;margin:0 0 12px}.filters{display:flex;gap:8px}.filters input{width:100%;min-width:0}.filters input,.filters select,input[type=text],textarea{border:1px solid #d0d7de;border-radius:6px;padding:8px 10px;background:#fff}.filters select{width:95px}.list{max-height:calc(100vh - 230px);overflow:auto}.row{display:block;width:100%;border:0;border-bottom:1px solid #d8dee4;background:white;text-align:left;padding:12px 16px;color:inherit}.row:hover,.row.active{background:#f6f8fa}.row b{display:block;font-weight:600;overflow-wrap:anywhere}.meta{color:#57606a;font-size:12px;margin-top:5px}.pill{display:inline-block;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:650;background:#dafbe1;color:#1a7f37}.pill.closed{background:#fbefff;color:#8250df}.pill.merged{background:#ddf4ff;color:#0969da}.detail{padding:24px;min-height:500px}.detail h2{font-size:25px;line-height:1.25;margin:0 0 10px;overflow-wrap:anywhere}.detail h3{font-size:16px;margin:30px 0 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0}.btn{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:6px 12px;color:#24292f}.btn:hover{background:#eaeef2}.btn.primary{background:#2da44e;border-color:#2a9147;color:#fff}.btn.danger{color:#cf222e}.card{border:1px solid #d0d7de;border-radius:6px;margin:12px 0;overflow:hidden}.card-head{background:#f6f8fa;padding:9px 13px;border-bottom:1px solid #d0d7de;font-size:13px}.card-body{padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}.reply{margin-left:26px}.comment-actions{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:7px}.comment-actions button{font-size:12px}.field{margin:12px 0}.field label{display:block;font-weight:600;margin-bottom:5px}.field input,.field textarea{width:100%}textarea{min-height:130px;resize:vertical}.muted{color:#57606a}.error{background:#ffebe9;color:#82071e;padding:12px;border:1px solid #ff8182;border-radius:6px;white-space:pre-wrap;margin-bottom:14px}.note{background:#ddf4ff;color:#0550ae;padding:10px;border-radius:6px;margin:12px 0}.relations{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.relations a{border:1px solid #d0d7de;padding:3px 8px;border-radius:6px}.small{font-size:12px}.empty{padding:30px;text-align:center;color:#57606a}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{max-height:300px}.detail{padding:16px}}
.markdown{white-space:normal}.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}.markdown pre{background:#f6f8fa;padding:12px;overflow:auto;border-radius:6px}.markdown code{background:#f6f8fa;padding:1px 4px;border-radius:4px}.markdown pre code{padding:0}.markdown blockquote{margin:0;padding-left:12px;border-left:3px solid #d0d7de;color:#57606a}.markdown table{border-collapse:collapse;display:block;overflow:auto}.markdown th,.markdown td{border:1px solid #d0d7de;padding:5px 8px}
</style></head><body>
<header><strong>Factory26 / Braid Console</strong><select id="run" aria-label="选择实验运行"></select></header>
<main class="wrap"><div class="banner">人工介入实验 · 评论作者为 external；投递回执不表示 Agent 已读取。</div><div id="message" role="status"></div><div class="layout"><section class="panel"><div class="panel-head"><h1>Issues / Pull requests</h1><div class="filters"><input id="search" type="search" placeholder="搜索标题或编号" aria-label="搜索对象"><select id="kind" aria-label="对象类型"><option value="all">全部</option><option value="issue">Issue</option><option value="pr">PR</option></select></div></div><div id="list" class="list"></div></section><section id="detail" class="panel detail"><p class="empty">选择一个对象</p></section></div></main>
<script>
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let runs=[],items=[],item=null,selected=null,edit=false,dirty=false,busy=false,replyTo=null,notice='',activeRunId='',generation=0;
const expandedBodies=new Map(),expandedThreads=new Set();
async function api(path,options){const response=await fetch(path,{cache:'no-store',...options});const data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);return data}
function currentRun(){return runs.find(r=>r.id===$('run').value)}
function params(extra={}){return new URLSearchParams({run:$('run').value,...extra})}
function message(text,isError=false){$('message').innerHTML=text?`<div class="${isError?'error':'note'}">${esc(text)}</div>`:''}
function shortBody(text){return esc(text??'').replace(/\n/g,'<br>')}
function renderList(){const query=$('search').value.toLowerCase(),kind=$('kind').value;const filtered=items.filter(x=>(kind==='all'||x.kind===kind)&&(!query||`${x.kind} #${x.number} ${x.title}`.toLowerCase().includes(query)));$('list').innerHTML=filtered.map(x=>`<button class="row ${selected?.kind===x.kind&&selected?.id===x.id?'active':''}" data-kind="${x.kind}" data-id="${x.id}"><b><span class="pill ${x.state==='OPEN'?'':x.state==='MERGED'?'merged':'closed'}">${esc(x.state)}</span> ${esc(x.title)}</b><div class="meta">${x.kind==='pr'?'PR':'Issue'} #${x.number} · ${esc(x.assignees?.map(a=>'@'+a.login).join(', ')||'未指派')}</div></button>`).join('')||'<div class="empty">没有匹配对象</div>'}
function link(kind,id,label){return `<a href="#${kind}/${id}" data-kind="${kind}" data-id="${id}">${esc(label||`${kind==='pr'?'PR':'Issue'} #${id}`)}</a>`}
function relation(ref){return ref?link(ref.kind==='pull_request'?'pr':ref.kind,ref.number,`${ref.kind==='pull_request'?'PR':'Issue'} #${ref.number} · ${ref.title}`):''}
function commentCard(c,depth=0){
  const id=Number(c.database_id),author=c.author?.login||'未知',hidden=c.minimized;
  const cached=expandedBodies.get(id),body=c.body??cached?.body,html=c.body_html??cached?.html;
  const content=c.deleted?'<em>已删除</em>':body==null?`<em>${hidden?'隐藏正文':'已折叠正文'}</em> <button class="btn" data-action="expand-comment" data-comment="${id}">展开正文</button>`:html??shortBody(body);
  return `<section class="card" style="margin-left:${Math.min(depth,5)*22}px" id="comment-${id}"><div class="card-head"><b>${esc(author)}</b> · #${id} · ${esc(c.created_at||'')} ${hidden?'· 已隐藏':''} ${c.folded?'· 已解决':''} ${c.reply_to?'· 回复 #'+c.reply_to:''}</div><div class="card-body ${html?'markdown':''}">${content}${c.minimized_reason?`<div class="muted small">隐藏原因：${esc(c.minimized_reason)}</div>`:''}</div>${currentRun()?.writable?`<div class="comment-actions"><button class="btn" data-action="reply" data-comment="${id}">回复</button>${!c.deleted?`<button class="btn" data-action="${hidden?'unhide':'hide'}" data-comment="${id}">${hidden?'取消隐藏':'隐藏'}</button><button class="btn" data-action="${c.folded?'unresolve':'resolve'}" data-comment="${id}">${c.folded?'取消解决':'解决线程'}</button>`:''}</div>`:''}</section>`;
}
function discussionHtml(comments){
  const byId=new Map(comments.map(c=>[Number(c.database_id),c]));
  const roots=[...new Set(comments.map(c=>Number(c.thread_root)))];
  function depth(c){let n=0,parent=c.reply_to;while(parent&&byId.has(parent)&&n<5){n++;parent=byId.get(parent).reply_to}return n}
  return roots.map(root=>{
    const nodes=comments.filter(c=>Number(c.thread_root)===root);
    const folded=nodes.filter(c=>c.folded),open=expandedThreads.has(root);
    const summary=folded.length?`<section class="card"><div class="card-head">已解决线程 #${root} · ${folded.length} 条历史评论</div><div class="card-body"><button class="btn" data-action="${open?'collapse-thread':'expand-thread'}" data-comment="${root}">${open?'收起线程':'展开线程'}</button></div></section>`:'';
    const visible=open?nodes:nodes.filter(c=>!c.folded);
    return summary+visible.map(c=>commentCard(c,depth(c))).join('');
  }).join('');
}
function renderDetail(){if(!item){$('detail').innerHTML='<p class="empty">选择一个对象</p>';return}const writable=currentRun()?.writable;const relationRows=[item.parent_issue&&`父项 ${relation(item.parent_issue)}`,...(item.sub_issues||[]).map(x=>`子项 ${relation(x)}`),...(item.associated_prs||[]).map(x=>`关联 ${relation(x)}`),...(item.associated_issues||[]).map(x=>`关联 ${link('issue',x.number,`Issue #${x.number} · ${x.title}`)}`)].filter(Boolean);const comments=item.comments||[],discussion=discussionHtml(comments);
$('detail').innerHTML=`<h2>${esc(item.title)} <span class="muted">#${item.number}</span></h2><div class="toolbar"><span class="pill ${item.state==='OPEN'?'':item.state==='MERGED'?'merged':'closed'}">${esc(item.state)}</span><span class="muted">${item.kind==='pr'?'Pull request':'Issue'} · revision ${item.revision}${item.reason?' · '+esc(item.reason):''}</span></div><div class="muted">负责人：${esc(item.assignees?.map(a=>'@'+a.login).join(', ')||'未指派')}${item.kind==='pr'?` · ${esc(item.headRefName||item.head_ref||'?')} → ${esc(item.baseRefName||item.base_ref||'?')}${item.draft?' · Draft':''}`:''}</div>${relationRows.length?`<div class="relations">${relationRows.join('')}</div>`:''}${writable?`<div class="toolbar"><button class="btn" data-action="edit">编辑标题/正文</button>${item.state==='OPEN'?`<button class="btn danger" data-action="close">关闭</button>`:item.state!=='MERGED'?`<button class="btn" data-action="reopen">重新打开</button>`:''}</div>`:''}${edit?`<div class="card"><div class="card-head">编辑对象 · 完整正文替换</div><div class="card-body"><div class="field"><label for="title">标题</label><input id="title" type="text" value="${esc(item.title)}"></div><div class="field"><label for="body">正文</label><textarea id="body">${esc(item.body)}</textarea></div><button class="btn primary" data-action="save">保存修改</button> <button class="btn" data-action="cancel-edit">取消</button></div></div>`:`<section class="card"><div class="card-head"><b>正文</b></div><div class="card-body ${item.body_html?'markdown':''}">${item.body_html??(shortBody(item.body)||'<em>无正文</em>')}</div></section>`}<h3>讨论 · ${comments.length}</h3>${discussion||'<p class="muted">暂无评论</p>'}${writable?`<section class="card"><div class="card-head"><b id="reply-label">${replyTo?'回复 #'+replyTo:'新评论'}</b>${replyTo?' <button class="btn" data-action="cancel-reply">取消回复</button>':''}</div><div class="card-body"><div class="field"><label for="comment-body">评论正文</label><textarea id="comment-body" placeholder="可用 @成员名 通知负责人"></textarea></div><button class="btn primary" data-action="send">发表评论</button></div></section>`:''}`;}
function renderKeepingDraft(){const draft={title:$('title')?.value,body:$('body')?.value,comment:$('comment-body')?.value};renderDetail();for(const name of ['title','body'])if(draft[name]!==undefined&&$(name))$(name).value=draft[name];if(draft.comment!==undefined&&$('comment-body'))$('comment-body').value=draft.comment}
async function refreshExpanded(ticket){const requests=[...expandedThreads].map(async root=>{const comments=await api('/api/comment?'+params({id:root,thread:1}));if(ticket===generation)for(const c of comments)if(c.body!=null)expandedBodies.set(Number(c.database_id),{body:c.body,html:c.body_html})});for(const id of expandedBodies.keys())if(![...expandedThreads].some(root=>(item.comments||[]).some(c=>Number(c.database_id)===id&&Number(c.thread_root)===root))){requests.push((async()=>{const comments=await api('/api/comment?'+params({id}));if(ticket===generation&&comments[0]?.body!=null)expandedBodies.set(id,{body:comments[0].body,html:comments[0].body_html})})())}await Promise.all(requests)}
async function expandComment(id,thread){const ticket=generation;try{const comments=await api('/api/comment?'+params({id,...(thread?{thread:1}:{})}));if(ticket!==generation)return;for(const c of comments)if(c.body!=null)expandedBodies.set(Number(c.database_id),{body:c.body,html:c.body_html});if(thread)expandedThreads.add(id);renderKeepingDraft()}catch(error){if(ticket===generation)message(error.message,true)}}
async function refresh(force=false){if(busy)return;const ticket=generation;try{const next=await api('/api/items?'+params());if(ticket!==generation)return;items=next;renderList();if(selected){const fresh=await api('/api/item?'+params(selected));if(ticket!==generation)return;if(!dirty||force){item=fresh;await refreshExpanded(ticket);if(ticket===generation&&(!dirty||force))renderDetail()}else if(JSON.stringify(fresh)!==JSON.stringify(item)){notice='对象已变化；当前草稿保留。提交编辑前请检查最新内容。';message(notice)}}}catch(error){if(ticket===generation)message(error.message,true)}}
async function choose(kind,id){if(busy)return;if(dirty&&!confirm('当前草稿尚未提交。仍要切换对象吗？'))return;const ticket=++generation;selected={kind,id:Number(id)};edit=false;dirty=false;replyTo=null;expandedBodies.clear();expandedThreads.clear();message('');renderList();try{const fresh=await api('/api/item?'+params(selected));if(ticket!==generation)return;item=fresh;renderDetail();location.hash=`${kind}/${id}`}catch(error){if(ticket===generation)message(error.message,true)}}
async function act(action,extra={}){if(busy)return;busy=true;try{const payload={run:$('run').value,kind:item.kind,id:item.id,action,...extra};const result=await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});edit=false;dirty=false;replyTo=null;expandedBodies.clear();expandedThreads.clear();message(result.result?.trim()||'操作完成');busy=false;await refresh(true)}catch(error){message(error.message,true)}finally{busy=false}}
$('list').onclick=event=>{const row=event.target.closest('[data-kind][data-id]');if(row)choose(row.dataset.kind,row.dataset.id)};
$('detail').oninput=event=>{if(['title','body','comment-body'].includes(event.target.id))dirty=true};
$('detail').onclick=async event=>{const relation=event.target.closest('a[data-kind][data-id]');if(relation){event.preventDefault();return choose(relation.dataset.kind,relation.dataset.id)}const button=event.target.closest('button[data-action]');if(!button||!item)return;const action=button.dataset.action,comment=Number(button.dataset.comment);if(action==='expand-comment')return expandComment(comment,false);if(action==='expand-thread')return expandComment(comment,true);if(action==='collapse-thread'){expandedThreads.delete(comment);for(const c of item.comments||[])if(Number(c.thread_root)===comment)expandedBodies.delete(Number(c.database_id));renderKeepingDraft();return}if(action==='edit'){edit=true;renderKeepingDraft();return}if(action==='cancel-edit'){edit=false;dirty=false;renderKeepingDraft();return}if(action==='save')return act('edit',{title:$('title').value,body:$('body').value,revision:item.revision});if(action==='reply'){replyTo=comment;renderKeepingDraft();$('comment-body').focus();return}if(action==='cancel-reply'){replyTo=null;renderKeepingDraft();return}if(action==='send')return act('comment',{body:$('comment-body').value,reply_to:replyTo});if(action==='hide'){const reason=prompt(`隐藏评论 #${comment} 的原因`);if(reason===null)return;return act('hide',{comment,reason})}if(['unhide','resolve','unresolve'].includes(action))return act(action,{comment});if(action==='close'){if(!confirm(`确认关闭 ${item.kind==='pr'?'PR':'Issue'} #${item.id}？`))return;if(item.kind==='issue'){const reason=prompt('关闭原因：completed / not planned / duplicate','completed');if(reason===null)return;return act(action,{reason})}return act(action)}if(action==='reopen')return act(action)};
$('search').oninput=renderList;$('kind').onchange=renderList;$('run').onchange=async()=>{if(busy||dirty&&!confirm('当前草稿尚未提交。仍要切换运行吗？')){$('run').value=activeRunId;return}generation++;activeRunId=$('run').value;selected=null;item=null;edit=false;dirty=false;replyTo=null;expandedBodies.clear();expandedThreads.clear();renderDetail();await refresh()};
(async()=>{try{runs=await api('/api/runs');$('run').innerHTML=runs.map(r=>`<option value="${esc(r.id)}">${esc(r.label)} · ${r.writable?'可人工介入':'只读'}</option>`).join('');activeRunId=$('run').value;await refresh();const match=location.hash.match(/^#(issue|pr)\/(\d+)$/);if(match)await choose(match[1],match[2]);else if(items.length)await choose(items[0].kind,items[0].id);setInterval(()=>refresh(),5000)}catch(error){message(error.message,true)}})();
</script></body></html>
