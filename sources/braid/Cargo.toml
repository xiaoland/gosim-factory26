[package]
name = "braid"
version = "0.3.2"
edition = "2024"
rust-version = "1.93"
description = "Local Issue and PR working memory for coding agents"
license = "MIT"
repository = "https://github.com/xiaoland/braid"
publish = false

[[bin]]
name = "braid"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
comrak = { version = "0.54", default-features = false }
fs2 = "0.4"
hex = "0.4"
md5 = "0.8"
opentelemetry = { version = "0.32", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = "0.32"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs", "trace", "metrics", "with-serde"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["logs", "metrics", "trace"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
uuid = { version = "1.24", features = ["serde", "v7"] }
async-trait = "0.1.92"
which = "8.0.5"
git2 = "0.21.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
